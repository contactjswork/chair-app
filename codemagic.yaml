definitions:
  npm_cache_paths: &npm_cache_paths
    - $HOME/.npm

  # CHAIR charge le site en direct (server.url dans capacitor.*.config.ts —
  # l'app utilise du middleware Next.js, incompatible avec un export statique)
  # donc il n'y a pas de build web à embarquer. On configure juste les
  # permissions iOS (usage descriptions), le nom affiché et la version.
  #
  # NSLocationWhenInUseUsageDescription n'est déclarée QUE côté client (CHAIR) :
  # PRO n'a aucun code de géolocalisation (pas de "coiffeurs près de moi", la
  # recherche fauteuil se fait par ville/adresse saisie), déclarer une
  # permission inutilisée est un risque de rejet App Review. Elle est donc
  # absente du Info.plist committé (baseline = état client) et seule
  # configure_ios_location (workflow client uniquement) l'ajoute.
  #
  # Le projet Xcode (ios/App) est PARTAGÉ entre CHAIR et CHAIR PRO — un seul
  # App.xcodeproj, re-synchronisé à chaque build via cap:chair:sync / cap:pro:sync
  # puis "npx cap sync ios". Important : cap sync NE modifie PAS
  # PRODUCT_BUNDLE_IDENTIFIER ni CFBundleDisplayName dans le projet natif (ce
  # sont des réglages Xcode, pas des réglages Capacitor JS) — configure_bundle_id
  # et les étapes de branding ci-dessous le font explicitement à chaque build,
  # pour ne jamais dépendre de l'état laissé par le build précédent.
  configure_bundle_id: &configure_bundle_id
    name: Fixer le Bundle ID Xcode pour cette variante
    script: |
      cd frontend/ios/App
      sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj

  configure_ios_common: &configure_ios_common
    name: Configurer version
    script: |
      cd frontend/ios/App
      agvtool new-marketing-version 1.0.0

  configure_ios_location: &configure_ios_location
    name: Configurer permission localisation (client uniquement)
    script: |
      cd frontend
      PLIST="ios/App/App/Info.plist"

      /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'CHAIR utilise ta position pour te montrer les coiffeurs les plus proches de toi.'" "$PLIST" 2>/dev/null || \
      /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'CHAIR utilise ta position pour te montrer les coiffeurs les plus proches de toi.'" "$PLIST"

  # PRO n'a jamais de clé localisation : si un build précédent l'a laissée
  # dans le Info.plist committé, on la retire explicitement plutôt que de
  # compter sur l'état du fichier source.
  configure_ios_no_location: &configure_ios_no_location
    name: Retirer la permission localisation (PRO n'en a pas besoin)
    script: |
      cd frontend
      PLIST="ios/App/App/Info.plist"
      /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true

  # cap sync régénère ios/App/App/public/ depuis webDir : la page d'erreur
  # hors-ligne committée (server.errorPath des configs Capacitor) est écrasée
  # à chaque sync — on la restaure depuis git, puis on vérifie que le bundle
  # natif part complet (entitlements push, error.html, manifeste privacy).
  restore_native_bundle: &restore_native_bundle
    name: Restaurer page d'erreur + vérifier entitlements push
    script: |
      cd frontend
      git checkout -- ios/App/App/public/error.html || true
      test -f ios/App/App/public/error.html
      test -f ios/App/App/App.entitlements
      test -f ios/App/App/PrivacyInfo.xcprivacy
      grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" ios/App/App.xcodeproj/project.pbxproj

workflows:
  chair-client-ios:
    name: CHAIR (client) — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: chair_asc_key   # nom de la clé API App Store Connect, à créer dans Codemagic > Teams > Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.getchair.client
      vars:
        BUNDLE_ID: "app.getchair.client"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    cache:
      cache_paths: *npm_cache_paths
    scripts:
      - name: Installer les dépendances npm
        script: |
          cd frontend
          npm ci
      - name: Copier la config Capacitor CHAIR client
        script: |
          cd frontend
          npm run cap:chair:sync
      - name: Générer le projet iOS si absent + sync
        script: |
          cd frontend
          test -d ios || npx cap add ios
          npx cap sync ios
      - <<: *restore_native_bundle
      - <<: *configure_bundle_id
      - name: Configurer nom affiché + permissions caméra/photo (CHAIR)
        script: |
          cd frontend
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'CHAIR'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CHAIR utilise l appareil photo pour te laisser prendre ta photo de profil directement depuis l app.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CHAIR utilise l appareil photo pour te laisser prendre ta photo de profil directement depuis l app.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CHAIR accede a tes photos pour te laisser choisir ta photo de profil dans ta galerie.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'CHAIR accede a tes photos pour te laisser choisir ta photo de profil dans ta galerie.'" "$PLIST"
      - <<: *configure_ios_common
      - <<: *configure_ios_location
      - name: Récupérer/générer le certificat + profil App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Charger le certificat dans le trousseau de build
        script: |
          keychain initialize
          keychain add-certificates
      - name: Appliquer les profils de signature au projet Xcode
        script: |
          cd frontend/ios/App
          xcode-project use-profiles
      - name: Incrémenter le build number (dernier TestFlight + 1)
        script: |
          cd frontend/ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build .ipa
        script: |
          cd frontend
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Ajouter ton Apple ID à ce groupe dans App Store Connect > TestFlight
        # avant le premier build pour recevoir l'invitation automatiquement.
        beta_groups:
          - "Internal Testers"

  chair-pro-ios:
    name: CHAIR PRO — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: chair_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.getchair.pro
      vars:
        BUNDLE_ID: "app.getchair.pro"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    cache:
      cache_paths: *npm_cache_paths
    scripts:
      - name: Installer les dépendances npm
        script: |
          cd frontend
          npm ci
      - name: Copier la config Capacitor CHAIR PRO
        script: |
          cd frontend
          npm run cap:pro:sync
      - name: Générer le projet iOS si absent + sync
        script: |
          cd frontend
          test -d ios || npx cap add ios
          npx cap sync ios
      - <<: *restore_native_bundle
      - <<: *configure_bundle_id
      - name: Configurer nom affiché + permissions caméra/photo (CHAIR PRO)
        script: |
          cd frontend
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'CHAIR PRO'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'CHAIR PRO utilise l appareil photo pour publier vos realisations et vos stories.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'CHAIR PRO utilise l appareil photo pour publier vos realisations et vos stories.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'CHAIR PRO accede a vos photos pour publier une realisation depuis votre galerie.'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'CHAIR PRO accede a vos photos pour publier une realisation depuis votre galerie.'" "$PLIST"
      - <<: *configure_ios_common
      - <<: *configure_ios_no_location
      - name: Récupérer/générer le certificat + profil App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Charger le certificat dans le trousseau de build
        script: |
          keychain initialize
          keychain add-certificates
      - name: Appliquer les profils de signature au projet Xcode
        script: |
          cd frontend/ios/App
          xcode-project use-profiles
      - name: Incrémenter le build number
        script: |
          cd frontend/ios/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build .ipa
        script: |
          cd frontend
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"

  # CHAIR BUSINESS — 3e binaire (gérants de salon). Même projet Xcode partagé,
  # re-brandé à chaque build comme les deux autres. Prérequis App Store
  # Connect : créer l'app app.getchair.business (New App) avant le 1er build.
  chair-business-ios:
    name: CHAIR BUSINESS — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: chair_asc_key
    environment:
