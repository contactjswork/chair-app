; Limites d'upload — le PHP-FPM qui sert réellement le site (vu via HTTP)
; peut avoir des valeurs différentes du PHP CLI (même écart documenté pour
; la version PHP dans docs/DEPLOY.md). upload_max_filesize couvre le fichier
; envoyé (photo spécialité, avatar, logo, diplôme...) ; post_max_size doit
; toujours être strictement supérieur (l'enveloppe multipart est un peu plus
; grosse que le fichier seul). PHP-FPM relit ce fichier automatiquement
; (cache ~300s), aucun redémarrage requis.
upload_max_filesize = 20M
post_max_size = 21M
